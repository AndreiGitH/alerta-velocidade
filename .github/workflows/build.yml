                  if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION);
                  else startForeground(1, n);

                  if (tg == null) tg = new ToneGenerator(AudioManager.STREAM_MUSIC, 100);
                  if (lm == null) {
                      lm = getSystemService(LocationManager.class);
                      try { lm.requestLocationUpdates(LocationManager.GPS_PROVIDER, 500, 0, this, Looper.getMainLooper()); }
                      catch (SecurityException e) { stopSelf(); }
                  }
                  statusVia = usarVia ? "Buscando limite da via..." : "Limite da via desligado";
                  rodando = true;
                  return START_STICKY;
              }

              Notification notif(String txt) {
                  PendingIntent pi = PendingIntent.getActivity(this, 0,
                      new Intent(this, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                  // "+ Radar": abre o app direto na tela de escolher a velocidade e volta ao Maps depois
                  Intent marcar = new Intent(this, MainActivity.class)
                      .putExtra(MainActivity.EXTRA_MARCAR, true)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent piMarcar = PendingIntent.getActivity(this, 1, marcar,
                      PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification.Action acao = new Notification.Action.Builder(
                      android.graphics.drawable.Icon.createWithResource(this, android.R.drawable.ic_input_add),
                      "+ Radar", piMarcar).build();
                  return new Notification.Builder(this, "vel")
                      .addAction(acao)
                      .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                      .setContentTitle("Alerta de Velocidade")
                      .setContentText(txt)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setContentIntent(pi)
                      .build();
              }

              void bip(int n, int tom) {
                  for (int k = 0; k < n; k++) {
                      h.postDelayed(() -> { if (tg != null) tg.startTone(tom, 200); }, k * 300L);
                  }
              }

              // Fala o limite (audio/40.mp3, 60, 80, 100 viram v40, v60...). Sem locução para esse valor: bipes.
              // Os alertas entram numa fila: se passar de dois limites seguidos, fala um depois do outro.
              final ArrayDeque<int[]> fila = new ArrayDeque<>();
              boolean ocupado = false;

              void alertar(int limite, int bipes, int tom) {
                  fila.add(new int[]{limite, bipes, tom});
                  if (!ocupado) proximo();
              }

              void proximo() {
                  int[] a = fila.poll();
                  if (a == null) { ocupado = false; soltarFoco(); return; }
                  ocupado = true;
                  int id = getResources().getIdentifier(a[0] < 0 ? "vradar" : "v" + a[0], "raw", getPackageName());
                  AudioAttributes attrs = new AudioAttributes.Builder()
                      .setUsage(AudioAttributes.USAGE_ASSISTANCE_NAVIGATION_GUIDANCE)
                      .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                      .build();
                  MediaPlayer mp = id == 0 ? null : MediaPlayer.create(this, id, attrs, AudioManager.AUDIO_SESSION_ID_GENERATE);
                  if (mp == null) { bip(a[1], a[2]); h.postDelayed(this::proximo, a[1] * 300L + 300); return; }
                  if (foco == null) {
                      // Abaixa o som do Maps/música enquanto fala
                      foco = new AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK)
                          .setAudioAttributes(attrs).build();
                      getSystemService(AudioManager.class).requestAudioFocus(foco);
                  }
                  voz = mp;
                  mp.setOnCompletionListener(m -> { m.release(); if (voz == m) voz = null; proximo(); });
                  mp.setOnErrorListener((m, w, x) -> { m.release(); if (voz == m) voz = null; proximo(); return true; });
                  mp.start();
              }

              void soltarFoco() {
                  if (foco != null) { getSystemService(AudioManager.class).abandonAudioFocusRequest(foco); foco = null; }
              }

              void pararVoz() {
                  fila.clear();
                  ocupado = false;
                  if (voz != null) { voz.release(); voz = null; }
                  soltarFoco();
              }

              // ---- Radares (assets/radares.csv: lat,lon,limite,rodovia,km,sentido,fonte) ----
              static final float RADAR_M = 200;      // distância do aviso
              static final float REARME_M = 400;     // longe disso, o radar pode ser avisado de novo
              boolean alertarRadar;
              double[] rLat, rLon;
              int[] rLim;
              boolean[] rPortatil; // ponto onde um radar portátil PODE estar
              final HashSet<Integer> avisados = new HashSet<>();

              void carregarRadares() {
                  if (rLat != null) return;
                  ArrayList<String[]> linhas = new ArrayList<>();
                  File baixado = new File(getFilesDir(), "radares.csv");
                  try (BufferedReader in = new BufferedReader(new InputStreamReader(
                          baixado.exists() ? new FileInputStream(baixado) : getAssets().open("radares.csv"), "UTF-8"))) {
                      in.readLine(); // cabeçalho
                      String l;
                      while ((l = in.readLine()) != null) { String[] c = l.split(","); if (c.length >= 3) linhas.add(c); }
                  } catch (Exception e) { return; }
                  // Radares marcados pelo usuário com o botão + (sem cabeçalho)
                  File meus = new File(getFilesDir(), "radares_usuario.csv");
                  if (meus.exists()) {
                      try (BufferedReader in = new BufferedReader(new InputStreamReader(new FileInputStream(meus), "UTF-8"))) {
                          String l;
                          while ((l = in.readLine()) != null) { String[] c = l.split(","); if (c.length >= 3) linhas.add(c); }
                      } catch (Exception e) { /* mantém só a base */ }
                  }
                  int n = linhas.size();
                  double[] la = new double[n], lo = new double[n];
                  int[] li = new int[n];
                  boolean[] po = new boolean[n];
                  for (int i = 0; i < n; i++) {
                      String[] c = linhas.get(i);
                      po[i] = c[c.length - 1].toLowerCase().contains("port");
                      try {
                          la[i] = Double.parseDouble(linhas.get(i)[0]);
                          lo[i] = Double.parseDouble(linhas.get(i)[1]);
                          li[i] = Integer.parseInt(linhas.get(i)[2]);
                      } catch (Exception e) { la[i] = 99; }
                  }
                  rLat = la; rLon = lo; rLim = li; rPortatil = po;
              }

              // Avisa uma vez por radar que esteja à frente e a até 200 m. O radar do sentido
              // oposto, logo ao lado, é marcado junto para não avisar duas vezes.
              void verificarRadares(Location loc) {
                  if (recarregarRadares) {
                      recarregarRadares = false;
                      rLat = null;
                      avisados.clear();
                      carregarRadares();
                  }
                  if (rLat == null) return;
                  double lat = loc.getLatitude(), lon = loc.getLongitude();
                  float rumo = loc.hasBearing() && loc.hasSpeed() && loc.getSpeed() > 3 ? loc.getBearing() : -1;
                  float[] res = new float[2];
                  ArrayList<Integer> perto = new ArrayList<>();
                  float menor = Float.MAX_VALUE;
                  int alvo = -1;
                  for (int i = 0; i < rLat.length; i++) {
                      if (Math.abs(rLat[i] - lat) > 0.005 || Math.abs(rLon[i] - lon) > 0.006) { avisados.remove(i); continue; }
                      Location.distanceBetween(lat, lon, rLat[i], rLon[i], res);
                      if (res[0] > REARME_M) { avisados.remove(i); continue; }
                      perto.add(i);
                      double dif = Math.abs((((res[1] - rumo) % 360) + 540) % 360 - 180);
                      boolean frente = rumo < 0 || dif < 40;
                      if (frente && res[0] <= RADAR_M && res[0] < menor) { menor = res[0]; alvo = i; }
                  }
                  if (alvo < 0) { radarInfo = ""; return; }
                  radarInfo = (rPortatil[alvo] ? "Possível radar portátil a " : "Radar a ") + Math.round(menor) + " m" + (rLim[alvo] > 0 ? "  ·  " + rLim[alvo] + " km/h" : "");
                  if (avisados.contains(alvo)) return;
                  for (int j : perto) {
                      Location.distanceBetween(rLat[alvo], rLon[alvo], rLat[j], rLon[j], res);
                      if (res[0] < 150) avisados.add(j);
                  }
                  // "Radar 200 metros" + o limite falado ("sessenta"), se houver locução para ele
                  alertar(-1, 2, ToneGenerator.TONE_PROP_BEEP2);
                  if (rLim[alvo] > 0) alertar(rLim[alvo], 0, ToneGenerator.TONE_PROP_BEEP);
              }

              @Override
              public void onLocationChanged(Location loc) {
                  ultLat = loc.getLatitude();
                  ultLon = loc.getLongitude();
                  if (usarVia) talvezConsultar(loc);
                  if (!loc.hasSpeed()) return;
                  float v = loc.getSpeed() * 3.6f;
                  kmh = v;
                  if (alertarRadar) verificarRadares(loc);

                  // Limite da via vencido (sem atualização recente)? Volta aos limites fixos.
                  if (limVia > 0 && System.currentTimeMillis() - ultimoSucesso > VALIDADE_MS) {
                      limVia = -1;
                      statusVia = "Limite da via indisponível, usando limites fixos";
                  }

                  String txt;
                  boolean via = limVia > 0 && !forcar;
                  if (via) {
                      // Usa o limite da via
                      if (!acimaVia && v >= limVia) { acimaVia = true; alertar(limVia, 3, ToneGenerator.TONE_PROP_BEEP2); }
                      else if (acimaVia && v < limVia - MARGEM) { acimaVia = false; }
                      for (int i = 0; i < 3; i++) acima[i] = v >= lims[i]; // evita apito ao voltar aos fixos
                      txt = Math.round(v) + " km/h  ·  limite da via " + limVia;
                  } else {
                      // Usa os 3 limites fixos
                      for (int i = 0; i < 3; i++) {
                          if (!acima[i] && v >= lims[i]) { acima[i] = true; alertar(lims[i], i + 1, ToneGenerator.TONE_PROP_BEEP); }
                          else if (acima[i] && v < lims[i] - MARGEM) { acima[i] = false; }
                      }
                      txt = Math.round(v) + " km/h  ·  limites " + lims[0] + " / " + lims[1] + " / " + lims[2];
                  }
                  for (int i = 0; i < 3; i++) acimaFixo[i] = acima[i];
                  if (via) nivel = acimaVia ? 2 : 0;
                  else nivel = acima[1] || acima[2] ? 2 : acima[0] ? 1 : 0;
                  nm.notify(1, notif(txt));
              }

              void talvezConsultar(Location loc) {
                  long agora = System.currentTimeMillis();
                  if (consultando) return;
                  boolean tempo = agora - ultimaConsulta >= INTERVALO_MS;
                  boolean dist = locUltimaConsulta == null || loc.distanceTo(locUltimaConsulta) >= DISTANCIA_M;
                  if (!tempo && !dist) return;
                  if (agora - ultimaConsulta < 3000) return; // nunca mais de 1 consulta a cada 3 s
                  consultando = true;
                  ultimaConsulta = agora;
                  locUltimaConsulta = new Location(loc);
                  final double lat = loc.getLatitude(), lon = loc.getLongitude();
                  final float rumo = loc.hasBearing() && loc.hasSpeed() && loc.getSpeed() > 2 ? loc.getBearing() : -1;
                  final String tt = chaveTomTom;
                  rede.execute(() -> {
                      // 1º TomTom (se tiver chave); sem limite lá, tenta o OpenStreetMap
                      Object[] r = null;
                      String fonte = "TomTom";
                      if (!tt.isEmpty()) {
                          try { r = consultarTomTom(tt, lat, lon, rumo); }
                          catch (Exception e) { erro = "TomTom " + e.getMessage(); }
                      }
                      if (r == null || (Integer) r[0] <= 0) {
                          Object[] o = null;
                          for (int t = 0; t < SERVIDORES.length && o == null; t++) {
                              try { o = consultar(SERVIDORES[servidor], lat, lon); }
                              catch (Exception e) {
                                  erro = e.getClass().getSimpleName() + (e.getMessage() != null ? ": " + e.getMessage() : "");
                                  servidor = (servidor + 1) % SERVIDORES.length;
                              }
                          }
                          if (o != null && (r == null || (Integer) o[0] > 0)) { r = o; fonte = "OSM"; }
                      }
                      final Object[] res = r;
                      final String f = fonte;
                      h.post(() -> {
                          consultando = false;
                          if (res == null) { statusVia = "Sem conexão com TomTom/OpenStreetMap (" + erro + ")"; return; }
                          ultimoSucesso = System.currentTimeMillis();
                          int novo = (Integer) res[0];
                          if (novo != limVia) acimaVia = false; // limite mudou: rearma o alerta
                          limVia = novo;
                          nomeVia = res[1] + "  ·  " + f;
                          statusVia = novo > 0 ? "" : ((String) res[1]).isEmpty()
                              ? "Nenhuma via encontrada, usando limites fixos"
                              : res[1] + ": sem limite cadastrado, usando limites fixos";
                      });
                  });
              }

              // TomTom Reverse Geocoding com returnSpeedLimit. Retorna {limite, nome da via}; limite -1 se não houver.
              static Object[] consultarTomTom(String chave, double lat, double lon, float rumo) throws Exception {
                  String url = String.format(Locale.US,
                      "https://api.tomtom.com/search/2/reverseGeocode/%.6f,%.6f.json?key=%s&returnSpeedLimit=true&radius=50&language=pt-BR",
                      lat, lon, URLEncoder.encode(chave, "UTF-8"));
                  if (rumo >= 0) url += "&heading=" + Math.round(rumo); // ajuda a escolher a via certa num cruzamento
                  HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                  c.setConnectTimeout(8000);
                  c.setReadTimeout(10000);
                  int cod = c.getResponseCode();
                  if (cod == 403 || cod == 401) throw new Exception("chave inválida");
                  if (cod == 429) throw new Exception("cota diária esgotada");
                  if (cod != 200) throw new Exception("HTTP " + cod);
                  ByteArrayOutputStream buf = new ByteArrayOutputStream();
                  try (InputStream in = c.getInputStream()) {
                      byte[] b = new byte[8192]; int n;
                      while ((n = in.read(b)) > 0) buf.write(b, 0, n);
                  }
                  JSONArray ads = new JSONObject(buf.toString("UTF-8")).optJSONArray("addresses");
                  if (ads == null || ads.length() == 0) return new Object[]{-1, ""};
                  JSONObject a = ads.getJSONObject(0).optJSONObject("address");
                  if (a == null) return new Object[]{-1, ""};
                  String nome = a.optString("streetName", "");
                  JSONArray rotas = a.optJSONArray("routeNumbers");
                  String ref = rotas != null && rotas.length() > 0 ? rotas.optString(0) : "";
                  if (nome.isEmpty()) nome = ref.isEmpty() ? "Via sem nome" : ref;
                  else if (!ref.isEmpty() && !nome.contains(ref)) nome = nome + " (" + ref + ")";
                  return new Object[]{lerLimite(a.optString("speedLimit", "")), nome};
              }

              // Retorna {limite, nome da via}. Limite -1 se a via mais próxima não tiver maxspeed.
              Object[] consultar(String url, double lat, double lon) throws Exception {
                  String q = String.format(Locale.US,
                      "[out:json][timeout:20];way(around:30,%.6f,%.6f)[highway~\"%s\"];out tags geom;",
                      lat, lon, TIPOS);
                  HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                  c.setConnectTimeout(10000);
                  c.setReadTimeout(25000);
                  c.setDoOutput(true);
                  c.setRequestProperty("User-Agent", "AlertaVelocidade/3.1 (Android; uso pessoal)");
                  c.setRequestProperty("Accept", "application/json");
                  c.setRequestProperty("Content-Type", "application/x-www-form-urlencoded");
                  try (OutputStream o = c.getOutputStream()) {
                      o.write(("data=" + URLEncoder.encode(q, "UTF-8")).getBytes("UTF-8"));
                  }
                  int cod = c.getResponseCode();
                  if (cod != 200) throw new Exception("HTTP " + cod + (cod == 429 ? " servidor ocupado" : ""));
                  ByteArrayOutputStream buf = new ByteArrayOutputStream();
                  try (InputStream in = c.getInputStream()) {
                      byte[] b = new byte[8192]; int n;
                      while ((n = in.read(b)) > 0) buf.write(b, 0, n);
                  }
                  JSONArray els = new JSONObject(buf.toString("UTF-8")).getJSONArray("elements");

                  JSONObject melhor = null;
                  double menor = Double.MAX_VALUE;
                  for (int i = 0; i < els.length(); i++) {
                      JSONObject w = els.getJSONObject(i);
                      JSONArray g = w.optJSONArray("geometry");
                      if (g == null || g.length() == 0) continue;
                      double d = distanciaVia(lat, lon, g);
                      if (d < menor) { menor = d; melhor = w; }
                  }
                  if (melhor == null) return new Object[]{-1, ""};
                  JSONObject tags = melhor.optJSONObject("tags");
                  if (tags == null) return new Object[]{-1, ""};
                  String nome = tags.optString("name", tags.optString("ref", "Via sem nome"));
                  String ref = tags.optString("ref", "");
                  if (!ref.isEmpty() && !nome.contains(ref)) nome = nome + " (" + ref + ")";
                  return new Object[]{lerLimite(tags.optString("maxspeed", "")), nome};
              }

              static int lerLimite(String s) {
                  Matcher m = Pattern.compile("(\\d+)").matcher(s);
                  if (!m.find()) return -1;
                  int v = Integer.parseInt(m.group(1));
                  if (s.toLowerCase(Locale.ROOT).contains("mph")) v = Math.round(v * 1.609f);
                  return v >= 5 && v <= 150 ? v : -1;
              }

              // Distância em metros do ponto até a linha da via (aproximação plana, ok para curtas distâncias)
              static double distanciaVia(double lat, double lon, JSONArray g) {
                  double kx = 111320 * Math.cos(Math.toRadians(lat)), ky = 110540;
                  double menor = Double.MAX_VALUE;
                  double px = 0, py = 0;
                  for (int i = 0; i < g.length(); i++) {
                      JSONObject p = g.optJSONObject(i);
                      if (p == null) continue;
                      double x = (p.optDouble("lon") - lon) * kx, y = (p.optDouble("lat") - lat) * ky;
                      if (i > 0) menor = Math.min(menor, distSegmento(px, py, x, y));
                      else menor = Math.hypot(x, y);
                      px = x; py = y;
                  }
                  return menor;
              }

              static double distSegmento(double ax, double ay, double bx, double by) {
                  double dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
                  double t = l2 == 0 ? 0 : Math.max(0, Math.min(1, -(ax * dx + ay * dy) / l2));
                  return Math.hypot(ax + t * dx, ay + t * dy);
              }

              @Override public void onStatusChanged(String p, int s, Bundle b) {}
              @Override public void onProviderEnabled(String p) {}
              @Override public void onProviderDisabled(String p) {}

              @Override
              public void onDestroy() {
                  rodando = false;
                  kmh = -1;
                  radarInfo = "";
                  ultLat = ultLon = Double.NaN;
                  limVia = -1;
                  nomeVia = "";
                  nivel = 0;
                  for (int i = 0; i < 3; i++) acimaFixo[i] = false;
                  if (lm != null) lm.removeUpdates(this);
                  h.removeCallbacksAndMessages(null);
                  rede.shutdownNow();
                  pararVoz();
                  if (tg != null) { tg.release(); tg = null; }
                  super.onDestroy();
              }

              @Override public IBinder onBind(Intent i) { return null; }
          }
          EOF

      - name: Compilar
        run: |
          # Em caso de erro, cada linha "error:" do Java vira um aviso visível na página da execução
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "error:|\.java:[0-9]+" build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $status

      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Alerta de Velocidade v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
