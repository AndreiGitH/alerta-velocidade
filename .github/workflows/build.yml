name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Criar projeto
        run: |
          mkdir -p app/src/main/java/com/alerta/velocidade

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AlertaVelocidade"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.alerta.velocidade'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.alerta.velocidade'
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName '1.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:label="Alerta de Velocidade"
                  android:icon="@android:drawable/ic_menu_mylocation"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".SpeedService"
                      android:exported="false"
                      android:foregroundServiceType="location"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/alerta/velocidade/MainActivity.java <<'EOF'
          package com.alerta.velocidade;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import java.util.ArrayList;

          public class MainActivity extends Activity {
              static final int[] PADRAO = {60, 80, 100};
              static final int[] CORES = {0xFFFFC94D, 0xFFFF8A3D, 0xFFFF4D5E};
              static final int FUNDO = 0xFF0B0F14, CARTAO = 0xFF151B23, BORDA = 0xFF222B36,
                  TEXTO = 0xFFF2F4F7, TEXTO2 = 0xFF8A94A6, VERDE = 0xFF2ED47A, VERMELHO = 0xFFE5484D;

              int[] lims = new int[3];
              TextView[] limTxt = new TextView[3];
              Gauge gauge;
              TextView btn, status, aviso;
              View ponto;
              float mostrada = -1;
              int estado = -1;
              Handler h = new Handler(Looper.getMainLooper());
              Runnable tick = new Runnable() {
                  public void run() { atualizar(); h.postDelayed(this, 50); }
              };

              int dp(float v) { return Math.round(v * getResources().getDisplayMetrics().density); }

              static GradientDrawable fundo(int cor, float raio) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(cor);
                  g.setCornerRadius(raio);
                  return g;
              }

              TextView texto(String s, float sp, int cor, boolean negrito) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, sp);
                  t.setTextColor(cor);
                  if (negrito) t.setTypeface(Typeface.create("sans-serif-medium", Typeface.NORMAL));
                  return t;
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(FUNDO);
                  getWindow().setNavigationBarColor(FUNDO);
                  SharedPreferences p = getSharedPreferences("cfg", 0);
                  for (int i = 0; i < 3; i++) lims[i] = p.getInt("l" + i, PADRAO[i]);

                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setPadding(dp(20), dp(28), dp(20), dp(24));

                  l.addView(texto("Alerta de Velocidade", 22, TEXTO, true));

                  LinearLayout linhaSt = new LinearLayout(this);
                  linhaSt.setGravity(Gravity.CENTER_VERTICAL);
                  linhaSt.setPadding(0, dp(6), 0, 0);
                  ponto = new View(this);
                  linhaSt.addView(ponto, new LinearLayout.LayoutParams(dp(8), dp(8)));
                  status = texto("", 14, TEXTO2, false);
                  status.setPadding(dp(8), 0, 0, 0);
                  linhaSt.addView(status);
                  l.addView(linhaSt);

                  gauge = new Gauge(this, lims);
                  LinearLayout.LayoutParams gp = new LinearLayout.LayoutParams(-1, -2);
                  gp.setMargins(0, dp(16), 0, dp(8));
                  l.addView(gauge, gp);

                  TextView tit = texto("LIMITES DE ALERTA", 12, TEXTO2, true);
                  tit.setLetterSpacing(0.12f);
                  tit.setPadding(dp(4), dp(8), 0, dp(10));
                  l.addView(tit);

                  LinearLayout cards = new LinearLayout(this);
                  for (int i = 0; i < 3; i++) {
                      LinearLayout.LayoutParams cp = new LinearLayout.LayoutParams(0, -2, 1);
                      if (i > 0) cp.setMarginStart(dp(10));
                      cards.addView(cartao(i), cp);
                  }
                  l.addView(cards);

                  btn = texto("", 18, FUNDO, true);
                  btn.setGravity(Gravity.CENTER);
                  btn.setLetterSpacing(0.08f);
                  btn.setOnClickListener(v -> {
                      if (SpeedService.rodando) stopService(new Intent(this, SpeedService.class));
                      else pedirPermissoes();
                  });
                  LinearLayout.LayoutParams bp = new LinearLayout.LayoutParams(-1, dp(60));
                  bp.setMargins(0, dp(24), 0, 0);
                  l.addView(btn, bp);

                  aviso = texto("Depois de iniciar, pode abrir o Maps. Os alertas sonoros continuam em segundo plano.", 13, TEXTO2, false);
                  aviso.setGravity(Gravity.CENTER);
                  aviso.setPadding(dp(12), dp(16), dp(12), 0);
                  l.addView(aviso);

                  ScrollView s = new ScrollView(this);
                  s.setBackgroundColor(FUNDO);
                  s.setFillViewport(true);
                  s.addView(l);
                  setContentView(s);
              }

              View cartao(int i) {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setGravity(Gravity.CENTER_HORIZONTAL);
                  c.setPadding(dp(8), dp(12), dp(8), dp(10));
                  GradientDrawable g = fundo(CARTAO, dp(16));
                  g.setStroke(dp(1), BORDA);
                  c.setBackground(g);

                  LinearLayout topo = new LinearLayout(this);
                  topo.setGravity(Gravity.CENTER_VERTICAL);
                  View bola = new View(this);
                  bola.setBackground(fundo(CORES[i], dp(4)));
                  topo.addView(bola, new LinearLayout.LayoutParams(dp(8), dp(8)));
                  TextView nome = texto((i + 1) + (i == 0 ? " bipe" : " bipes"), 12, TEXTO2, false);
                  nome.setPadding(dp(6), 0, 0, 0);
                  topo.addView(nome);
                  c.addView(topo);

                  limTxt[i] = texto(String.valueOf(lims[i]), 30, TEXTO, true);
                  limTxt[i].setGravity(Gravity.CENTER);
                  limTxt[i].setPadding(0, dp(4), 0, 0);
                  c.addView(limTxt[i]);
                  c.addView(texto("km/h", 11, TEXTO2, false));

                  LinearLayout bts = new LinearLayout(this);
                  bts.setPadding(0, dp(10), 0, 0);
                  bts.addView(passo("−", i, -5), new LinearLayout.LayoutParams(0, dp(36), 1));
                  LinearLayout.LayoutParams mp = new LinearLayout.LayoutParams(0, dp(36), 1);
                  mp.setMarginStart(dp(6));
                  bts.addView(passo("+", i, 5), mp);
                  c.addView(bts, new LinearLayout.LayoutParams(-1, -2));
                  return c;
              }

              TextView passo(String s, int i, int d) {
                  TextView t = texto(s, 20, TEXTO, false);
                  t.setGravity(Gravity.CENTER);
                  t.setBackground(fundo(BORDA, dp(10)));
                  t.setOnClickListener(v -> mudar(i, d));
                  return t;
              }

              void mudar(int i, int d) {
                  lims[i] = Math.max(5, Math.min(300, lims[i] + d));
                  limTxt[i].setText(String.valueOf(lims[i]));
                  getSharedPreferences("cfg", 0).edit().putInt("l" + i, lims[i]).apply();
                  gauge.invalidate();
              }

              void pedirPermissoes() {
                  ArrayList<String> faltam = new ArrayList<>();
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      faltam.add(Manifest.permission.ACCESS_FINE_LOCATION);
                      faltam.add(Manifest.permission.ACCESS_COARSE_LOCATION);
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      faltam.add(Manifest.permission.POST_NOTIFICATIONS);
                  }
                  if (faltam.isEmpty()) iniciar();
                  else requestPermissions(faltam.toArray(new String[0]), 1);
              }

              @Override
              public void onRequestPermissionsResult(int c, String[] perms, int[] res) {
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                      iniciar();
                  } else {
                      aviso.setText("Sem permissão de localização o app não consegue medir a velocidade.");
                  }
              }

              void iniciar() {
                  startForegroundService(new Intent(this, SpeedService.class));
              }

              void atualizar() {
                  boolean on = SpeedService.rodando;
                  float k = on ? SpeedService.kmh : -1;
                  if (k < 0) mostrada = -1;
                  else mostrada = mostrada < 0 ? k : mostrada + (k - mostrada) * 0.25f;
                  gauge.set(mostrada);

                  int e = !on ? 0 : (k < 0 ? 1 : 2);
                  if (e == estado) return;
                  estado = e;
                  int cor = e == 0 ? TEXTO2 : (e == 1 ? CORES[0] : VERDE);
                  status.setText(e == 0 ? "Parado" : (e == 1 ? "Aguardando sinal de GPS…" : "Monitorando"));
                  ponto.setBackground(fundo(cor, dp(4)));
                  btn.setText(on ? "PARAR" : "INICIAR");
                  btn.setTextColor(on ? TEXTO : FUNDO);
                  btn.setBackground(fundo(on ? VERMELHO : VERDE, dp(18)));
              }

              @Override protected void onResume() { super.onResume(); estado = -1; h.post(tick); }
              @Override protected void onPause() { super.onPause(); h.removeCallbacks(tick); }

              static class Gauge extends View {
                  final int[] lims;
                  final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  final RectF r = new RectF();
                  final float d;
                  float v = -1;

                  Gauge(Context c, int[] lims) {
                      super(c);
                      this.lims = lims;
                      d = c.getResources().getDisplayMetrics().density;
                  }

                  void set(float nv) { if (nv != v) { v = nv; invalidate(); } }

                  int maximo() {
                      int m = Math.max(lims[0], Math.max(lims[1], lims[2])) + 40;
                      return Math.max(120, (m + 19) / 20 * 20);
                  }

                  int cor(float x) {
                      for (int i = 2; i >= 0; i--) if (x >= lims[i]) return CORES[i];
                      return VERDE;
                  }

                  @Override
                  protected void onMeasure(int ws, int hs) {
                      int w = MeasureSpec.getSize(ws);
                      int lado = Math.min(w, Math.round(320 * d));
                      setMeasuredDimension(w, Math.round(lado * 0.88f));
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      float w = getWidth();
                      float lado = Math.min(w, 320 * d);
                      float esp = 16 * d;
                      float raio = lado / 2 - esp - 14 * d;
                      float cx = w / 2, cy = esp + 14 * d + raio;
                      r.set(cx - raio, cy - raio, cx + raio, cy + raio);
                      int m = maximo();

                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeCap(Paint.Cap.ROUND);
                      p.setStrokeWidth(esp);
                      p.setColor(0xFF1C232D);
                      c.drawArc(r, 135, 270, false, p);

                      float x = v < 0 ? 0 : Math.min(v, m);
                      int corAtual = cor(x);
                      if (x > 0.5f) {
                          p.setColor(corAtual);
                          c.drawArc(r, 135, 270 * x / m, false, p);
                      }

                      p.setStrokeWidth(3 * d);
                      for (int i = 0; i < 3; i++) {
                          double a = Math.toRadians(135 + 270.0 * Math.min(lims[i], m) / m);
                          float r1 = raio + esp / 2 + 4 * d, r2 = r1 + 8 * d;
                          float cs = (float) Math.cos(a), sn = (float) Math.sin(a);
                          p.setColor(CORES[i]);
                          c.drawLine(cx + cs * r1, cy + sn * r1, cx + cs * r2, cy + sn * r2, p);
                      }

                      p.setStyle(Paint.Style.FILL);
                      p.setTextAlign(Paint.Align.CENTER);
                      p.setTypeface(Typeface.create("sans-serif-light", Typeface.NORMAL));
                      p.setTextSize(raio * 0.72f);
                      p.setColor(v < 0 || corAtual == VERDE ? TEXTO : corAtual);
                      c.drawText(v < 0 ? "--" : String.valueOf(Math.round(v)), cx, cy + raio * 0.2f, p);

                      p.setTypeface(Typeface.create("sans-serif-medium", Typeface.NORMAL));
                      p.setTextSize(14 * d);
                      p.setColor(TEXTO2);
                      c.drawText("km/h", cx, cy + raio * 0.45f, p);
                      p.setTextSize(11 * d);
                      c.drawText("0", cx - raio * 0.55f, cy + raio * 0.85f, p);
                      c.drawText(String.valueOf(m), cx + raio * 0.55f, cy + raio * 0.85f, p);
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/alerta/velocidade/SpeedService.java <<'EOF'
          package com.alerta.velocidade;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.media.AudioManager;
          import android.media.ToneGenerator;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;

          public class SpeedService extends Service implements LocationListener {
              static volatile boolean rodando = false;
              static volatile float kmh = -1;
              static final int MARGEM = 3; // km/h abaixo do limite para rearmar o alerta

              boolean[] acima = new boolean[3];
              int[] lims = new int[3];
              ToneGenerator tg;
              LocationManager lm;
              NotificationManager nm;
              Handler h = new Handler(Looper.getMainLooper());
              // limites alterados na tela valem na hora, sem reiniciar o serviço
              SharedPreferences.OnSharedPreferenceChangeListener ouvinte = (sp, k) -> carregar(sp);

              void carregar(SharedPreferences p) {
                  for (int i = 0; i < 3; i++) lims[i] = p.getInt("l" + i, MainActivity.PADRAO[i]);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int id) {
                  SharedPreferences p = getSharedPreferences("cfg", 0);
                  carregar(p);

                  nm = getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(new NotificationChannel("vel", "Velocidade", NotificationManager.IMPORTANCE_LOW));
                  Notification n = notif("Aguardando GPS...");
                  if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION);
                  else startForeground(1, n);

                  if (tg == null) tg = new ToneGenerator(AudioManager.STREAM_MUSIC, 100);
                  if (lm == null) {
                      p.registerOnSharedPreferenceChangeListener(ouvinte);
                      lm = getSystemService(LocationManager.class);
                      try { lm.requestLocationUpdates(LocationManager.GPS_PROVIDER, 500, 0, this, Looper.getMainLooper()); }
                      catch (SecurityException e) { stopSelf(); }
                  }
                  rodando = true;
                  return START_STICKY;
              }

              Notification notif(String txt) {
                  PendingIntent pi = PendingIntent.getActivity(this, 0,
                      new Intent(this, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                  return new Notification.Builder(this, "vel")
                      .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                      .setColor(MainActivity.VERDE)
                      .setContentTitle("Alerta de Velocidade")
                      .setContentText(txt)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setContentIntent(pi)
                      .build();
              }

              void bip(int n) {
                  for (int k = 0; k < n; k++) {
                      h.postDelayed(() -> { if (tg != null) tg.startTone(ToneGenerator.TONE_PROP_BEEP, 200); }, k * 300L);
                  }
              }

              @Override
              public void onLocationChanged(Location loc) {
                  if (!loc.hasSpeed()) return;
                  float v = loc.getSpeed() * 3.6f;
                  kmh = v;
                  for (int i = 0; i < 3; i++) {
                      if (!acima[i] && v >= lims[i]) { acima[i] = true; bip(i + 1); }
                      else if (acima[i] && v < lims[i] - MARGEM) { acima[i] = false; }
                  }
                  nm.notify(1, notif(Math.round(v) + " km/h  ·  limites " + lims[0] + " / " + lims[1] + " / " + lims[2]));
              }

              @Override public void onStatusChanged(String p, int s, Bundle b) {}
              @Override public void onProviderEnabled(String p) {}
              @Override public void onProviderDisabled(String p) {}

              @Override
              public void onDestroy() {
                  rodando = false;
                  kmh = -1;
                  getSharedPreferences("cfg", 0).unregisterOnSharedPreferenceChangeListener(ouvinte);
                  if (lm != null) lm.removeUpdates(this);
                  h.removeCallbacksAndMessages(null);
                  if (tg != null) { tg.release(); tg = null; }
                  super.onDestroy();
              }

              @Override public IBinder onBind(Intent i) { return null; }
          }
          EOF

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Alerta de Velocidade v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
