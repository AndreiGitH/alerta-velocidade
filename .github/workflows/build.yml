name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Criar projeto
        run: |
          mkdir -p app/src/main/java/com/alerta/velocidade app/src/main/res/raw

          # Locuções do repositório: audio/60.mp3 vira o recurso raw "v60"
          for f in audio/*.mp3; do cp "$f" "app/src/main/res/raw/v$(basename "$f")"; done

          # Radares (gerado por dados/gerar_radares.py a partir dos dados abertos da ANTT)
          mkdir -p app/src/main/assets
          cp dados/radares.csv app/src/main/assets/radares.csv
          cp docs/manual.html app/src/main/assets/manual.html

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AlertaVelocidade"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.alerta.velocidade'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.alerta.velocidade'
                  minSdk 26
                  targetSdk 34
                  versionCode 18
                  versionName '5.6'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:label="Alerta de Velocidade"
                  android:icon="@android:drawable/ic_menu_mylocation"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".SpeedService"
                      android:exported="false"
                      android:foregroundServiceType="location"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/alerta/velocidade/MainActivity.java <<'EOF'
          package com.alerta.velocidade;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Matrix;
          import android.graphics.Paint;
          import android.graphics.RadialGradient;
          import android.graphics.RectF;
          import android.graphics.Shader;
          import android.graphics.SweepGradient;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.InputType;
          import android.text.format.DateFormat;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Switch;
          import android.widget.TextView;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.LinkedHashMap;
          import java.util.Map;

          public class MainActivity extends Activity {
              static final int[] PADRAO = {60, 80, 100};
              static final int BG = Color.parseColor("#101418"), CARD = Color.parseColor("#1B2128"),
                  FG = Color.parseColor("#EEF2F5"), MUT = Color.parseColor("#8A96A3"),
                  OK = Color.parseColor("#3ECF8E"), BAD = Color.parseColor("#FF4D4F");

              EditText[] lim = new EditText[3];
              LinearLayout[] limBox = new LinearLayout[3];
              LinearLayout viaBox;
              Gauge gauge;
              TextView placa, via, st, btn;
              Switch usarVia;
              EditText chave;
              Switch forcar, alertaRadar;
              TextView radaresInfo;
              TextView radarTxt;
              TextView[] menos = new TextView[3], mais = new TextView[3];
              LinearLayout config;
              TextView engrenagem;
              Handler h = new Handler(Looper.getMainLooper());
              Runnable tick = new Runnable() {
                  public void run() { atualizar(); h.postDelayed(this, 500); }
              };

              int dp(float v) { return Math.round(v * getResources().getDisplayMetrics().density); }

              GradientDrawable fundo(int cor, float raio, int borda) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(cor);
                  g.setCornerRadius(dp(raio));
                  if (borda != 0) g.setStroke(dp(2), borda);
                  return g;
              }

              TextView texto(String s, float tam, int cor, boolean negrito) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(tam);
                  t.setTextColor(cor);
                  if (negrito) t.setTypeface(Typeface.DEFAULT_BOLD);
                  return t;
              }

              LinearLayout.LayoutParams margemTopo(int m) {
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.topMargin = dp(m);
                  return lp;
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  SharedPreferences p = getSharedPreferences("cfg", 0);

                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setPadding(dp(16), dp(20), dp(16), dp(24));
                  l.setBackgroundColor(BG);

                  // Título centralizado com engrenagem de configurações à direita
                  FrameLayout topo = new FrameLayout(this);
                  TextView titulo = texto("Alerta de Velocidade", 18, MUT, true);
                  titulo.setGravity(Gravity.CENTER);
                  topo.addView(titulo, new FrameLayout.LayoutParams(-1, -2, Gravity.CENTER_VERTICAL));
                  engrenagem = texto("⚙", 26, MUT, false);
                  engrenagem.setPadding(dp(12), 0, dp(4), 0);
                  TextView botaoMais = texto("+", 32, Color.parseColor("#06210F"), true);
                  botaoMais.setGravity(Gravity.CENTER);
                  botaoMais.setIncludeFontPadding(false);
                  botaoMais.setBackground(fundo(OK, 28, 0));
                  botaoMais.setOnClickListener(v -> adicionarRadar());
                  engrenagem.setOnClickListener(v -> abrirConfig());
                  topo.addView(engrenagem, new FrameLayout.LayoutParams(-2, -2, Gravity.END | Gravity.CENTER_VERTICAL));
                  TextView ajuda = texto("?", 22, MUT, true);
                  ajuda.setGravity(Gravity.CENTER);
                  ajuda.setBackground(fundo(CARD, 18, 0));
                  ajuda.setOnClickListener(v -> abrirManual());
                  FrameLayout.LayoutParams ap = new FrameLayout.LayoutParams(dp(36), dp(36), Gravity.START | Gravity.CENTER_VERTICAL);
                  topo.addView(ajuda, ap);
                  l.addView(topo, margemTopo(0));

                  // Velocímetro com relógio
                  gauge = new Gauge(this);
                  // Velocímetro com o botão + no canto inferior direito, ao lado do relógio
                  FrameLayout gaugeBox = new FrameLayout(this);
                  gaugeBox.addView(gauge, new FrameLayout.LayoutParams(-1, -2));
                  FrameLayout.LayoutParams mp = new FrameLayout.LayoutParams(dp(56), dp(56), Gravity.END | Gravity.BOTTOM);
                  mp.rightMargin = dp(6);
                  gaugeBox.addView(botaoMais, mp);
                  l.addView(gaugeBox, margemTopo(12));

                  // Aviso de radar próximo (só aparece quando há um a menos de 200 m)
                  radarTxt = texto("", 17, Color.WHITE, true);
                  radarTxt.setGravity(Gravity.CENTER);
                  radarTxt.setPadding(dp(12), dp(10), dp(12), dp(10));
                  radarTxt.setBackground(fundo(Color.parseColor("#B3261E"), 12, 0));
                  radarTxt.setVisibility(View.GONE);
                  l.addView(radarTxt, margemTopo(8));

                  // Placa + nome da via
                  viaBox = new LinearLayout(this);
                  viaBox.setGravity(Gravity.CENTER_VERTICAL);
                  viaBox.setPadding(dp(14), dp(12), dp(14), dp(12));
                  viaBox.setBackground(fundo(CARD, 12, 0));
                  placa = texto("?", 22, Color.BLACK, true);
                  placa.setGravity(Gravity.CENTER);
                  GradientDrawable g = new GradientDrawable();
                  g.setShape(GradientDrawable.OVAL);
                  g.setColor(Color.WHITE);
                  g.setStroke(dp(6), Color.parseColor("#D32F2F"));
                  placa.setBackground(g);
                  viaBox.addView(placa, new LinearLayout.LayoutParams(dp(64), dp(64)));
                  via = texto("Limite da via aparece aqui", 15, FG, false);
                  LinearLayout.LayoutParams vp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1);
                  vp.leftMargin = dp(14);
                  viaBox.addView(via, vp);
                  l.addView(viaBox, margemTopo(12));

                  // Chave única: forçar meus limites mesmo quando houver limite da via
                  forcar = new Switch(this);
                  forcar.setText("Forçar meus limites");
                  forcar.setTextColor(FG);
                  forcar.setTextSize(15);
                  forcar.setChecked(p.getBoolean("forcar", false));
                  SpeedService.forcar = forcar.isChecked();
                  forcar.setPadding(dp(14), dp(10), dp(14), dp(10));
                  forcar.setBackground(fundo(CARD, 12, 0));
                  forcar.setOnCheckedChangeListener((bt, on) -> {
                      SpeedService.forcar = on; // vale na hora, mesmo com o alerta ligado
                      getSharedPreferences("cfg", 0).edit().putBoolean("forcar", on).apply();
                  });

                  // Três limites lado a lado
                  LinearLayout lims = new LinearLayout(this);
                  for (int i = 0; i < 3; i++) {
                      limBox[i] = new LinearLayout(this);
                      limBox[i].setOrientation(LinearLayout.VERTICAL);
                      limBox[i].setGravity(Gravity.CENTER);
                      limBox[i].setPadding(dp(8), dp(10), dp(8), dp(6));
                      limBox[i].setBackground(fundo(CARD, 12, CARD));
                      TextView t = texto("Limite " + (i + 1), 12, MUT, false);
                      t.setGravity(Gravity.CENTER);
                      limBox[i].addView(t);
                      lim[i] = new EditText(this);
                      lim[i].setInputType(InputType.TYPE_CLASS_NUMBER);
                      lim[i].setTextColor(FG);
                      lim[i].setTextSize(26);
                      lim[i].setTypeface(Typeface.DEFAULT_BOLD);
                      lim[i].setGravity(Gravity.CENTER);
                      lim[i].setBackground(null);
                      lim[i].setPadding(0, dp(2), 0, dp(2));
                      lim[i].setText(String.valueOf(p.getInt("l" + i, PADRAO[i])));
                      limBox[i].addView(lim[i], new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT));
                      LinearLayout passos = new LinearLayout(this);
                      menos[i] = passo("−", i, -5);
                      mais[i] = passo("+", i, 5);
                      passos.addView(menos[i], new LinearLayout.LayoutParams(0, dp(34), 1));
                      LinearLayout.LayoutParams pm = new LinearLayout.LayoutParams(0, dp(34), 1);
                      pm.leftMargin = dp(6);
                      passos.addView(mais[i], pm);
                      limBox[i].addView(passos, margemTopo(4));
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1);
                      if (i > 0) lp.leftMargin = dp(10);
                      lims.addView(limBox[i], lp);
                  }
                  l.addView(lims, margemTopo(8));

                  criarConfig(p);

                  // Botão Iniciar / Parar
                  btn = texto("Iniciar", 20, Color.parseColor("#06210F"), true);
                  btn.setGravity(Gravity.CENTER);
                  btn.setPadding(0, dp(18), 0, dp(18));
                  btn.setOnClickListener(v -> {
                      if (SpeedService.rodando) {
                          stopService(new Intent(this, SpeedService.class));
                      } else {
                          salvar();
                          pedirPermissoes();
                      }
                  });
                  l.addView(btn, margemTopo(16));

                  st = texto("Depois de iniciar, pode abrir o Maps: o alerta continua em segundo plano. "
                      + "Para mudar os limites, toque em Parar.", 14, MUT, false);
                  st.setGravity(Gravity.CENTER);
                  l.addView(st, margemTopo(12));

                  ScrollView s = new ScrollView(this);
                  s.setBackgroundColor(BG);
                  s.setFillViewport(true);
                  s.addView(l);
                  setContentView(s);
                  tratarIntent(getIntent());
              }

              // Configurações (limite da via e chave TomTom) ficam num diálogo, fora da tela principal
              void criarConfig(SharedPreferences p) {
                  // Opção do limite da via
                  usarVia = new Switch(this);
                  usarVia.setText("Usar limite da via (TomTom / OpenStreetMap)");
                  usarVia.setTextColor(FG);
                  usarVia.setTextSize(15);
                  usarVia.setChecked(p.getBoolean("via", true));
                  usarVia.setPadding(dp(14), dp(14), dp(14), dp(14));
                  usarVia.setBackground(fundo(CARD, 12, 0));

                  // Chave TomTom fica só no celular (não vai para o repositório público)
                  chave = new EditText(this);
                  chave.setHint("Chave da API TomTom (opcional)");
                  chave.setHintTextColor(MUT);
                  chave.setTextColor(FG);
                  chave.setTextSize(14);
                  chave.setSingleLine(true);
                  chave.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_PASSWORD);
                  chave.setText(p.getString("tomtom", ""));
                  chave.setPadding(dp(14), dp(14), dp(14), dp(14));
                  chave.setBackground(fundo(CARD, 12, 0));
                  config = new LinearLayout(this);
                  config.setOrientation(LinearLayout.VERTICAL);
                  config.setPadding(dp(20), dp(12), dp(20), dp(4));
                  config.addView(usarVia, margemTopo(0));
                  alertaRadar = new Switch(this);
                  alertaRadar.setText("Avisar radares a 200 m");
                  alertaRadar.setTextColor(FG);
                  alertaRadar.setTextSize(15);
                  alertaRadar.setChecked(p.getBoolean("radar", true));
                  alertaRadar.setPadding(dp(14), dp(14), dp(14), dp(14));
                  alertaRadar.setBackground(fundo(CARD, 12, 0));
                  config.addView(alertaRadar, margemTopo(10));
                  if (forcar.getParent() != null) ((ViewGroup) forcar.getParent()).removeView(forcar);
                  config.addView(forcar, margemTopo(10));
                  config.addView(chave, margemTopo(10));
                  TextView testar = texto("▶  Testar vozes", 15, FG, true);
                  testar.setGravity(Gravity.CENTER);
                  testar.setPadding(0, dp(12), 0, dp(12));
                  testar.setBackground(fundo(CARD, 12, 0));
                  testar.setOnClickListener(v -> testarVozes(0));
                  config.addView(testar, margemTopo(10));
                  TextView atualizarRadares = texto("\u27F3  Atualizar radares", 15, FG, true);
                  atualizarRadares.setGravity(Gravity.CENTER);
                  atualizarRadares.setPadding(0, dp(12), 0, dp(12));
                  atualizarRadares.setBackground(fundo(CARD, 12, 0));
                  atualizarRadares.setOnClickListener(v -> atualizarRadares());
                  config.addView(atualizarRadares, margemTopo(10));
                  radaresInfo = texto("", 13, MUT, false);
                  radaresInfo.setPadding(dp(4), dp(8), dp(4), 0);
                  config.addView(radaresInfo, margemTopo(0));
                  TextView meusRadares = texto("\u2630  Meus radares (revisar / apagar)", 15, FG, true);
                  meusRadares.setGravity(Gravity.CENTER);
                  meusRadares.setPadding(0, dp(12), 0, dp(12));
                  meusRadares.setBackground(fundo(CARD, 12, 0));
                  meusRadares.setOnClickListener(v -> abrirMeusRadares());
                  config.addView(meusRadares, margemTopo(10));
              }

              // Botão − / + que muda o limite de 5 em 5 km/h
              TextView passo(String s, int i, int d) {
                  TextView t = texto(s, 20, FG, true);
                  t.setGravity(Gravity.CENTER);
                  t.setBackground(fundo(BG, 10, 0));
                  t.setOnClickListener(v -> {
                      int n = Math.max(5, Math.min(300, (limite(i) + d) / 5 * 5));
                      lim[i].setText(String.valueOf(n));
                  });
                  return t;
              }

              // Toca as locuções dos 3 limites em sequência, para conferir o som
              void testarVozes(int i) {
                  if (i >= 3) return;
                  int id = getResources().getIdentifier("v" + limite(i), "raw", getPackageName());
                  android.media.MediaPlayer mp = id == 0 ? null : android.media.MediaPlayer.create(this, id);
                  if (mp == null) {
                      st.setText("Sem locução para " + limite(i) + " km/h (vai tocar bipes).");
                      h.postDelayed(() -> testarVozes(i + 1), 600);
                      return;
                  }
                  mp.setOnCompletionListener(m -> { m.release(); testarVozes(i + 1); });
                  mp.start();
              }

              static final String URL_RADARES =
                  "https://raw.githubusercontent.com/AndreiGitH/alerta-velocidade/main/dados/radares.csv";

              // Manual em HTML (assets/manual.html) numa janela de tela cheia
              void abrirManual() {
                  WebView w = new WebView(this);
                  w.setBackgroundColor(BG);
                  w.loadUrl("file:///android_asset/manual.html");
                  new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_NoActionBar)
                      .setView(w)
                      .setPositiveButton("Fechar", null)
                      .show();
              }

              // Quantos radares há por fonte (última coluna do CSV)
              static Map<String, Integer> contarFontes(String csv) {
                  Map<String, Integer> n = new LinkedHashMap<>();
                  String[] linhas = csv.split("\n");
                  for (int i = 1; i < linhas.length; i++) {
                      String l = linhas[i].trim();
                      if (l.isEmpty()) continue;
                      String fonte = l.substring(l.lastIndexOf(',') + 1);
                      Integer v = n.get(fonte);
                      n.put(fonte, v == null ? 1 : v + 1);
                  }
                  return n;
              }

              static String resumo(Map<String, Integer> n) {
                  int total = 0;
                  StringBuilder sb = new StringBuilder();
                  for (Map.Entry<String, Integer> e : n.entrySet()) {
                      sb.append(e.getKey()).append(": ").append(e.getValue()).append("\n");
                      total += e.getValue();
                  }
                  return sb.append("Total: ").append(total).append(" radares").toString();
              }

              static String ler(InputStream in) throws Exception {
                  ByteArrayOutputStream buf = new ByteArrayOutputStream();
                  byte[] b = new byte[8192];
                  int k;
                  while ((k = in.read(b)) > 0) buf.write(b, 0, k);
                  in.close();
                  return buf.toString("UTF-8");
              }

              // Base em uso: a baixada pelo botão (files/radares.csv) ou a que veio no APK
              void mostrarBaseRadares() {
                  try {
                      File f = new File(getFilesDir(), "radares.csv");
                      String txt = ler(f.exists() ? new FileInputStream(f) : getAssets().open("radares.csv"));
                      String quando = f.exists()
                          ? "atualizada em " + DateFormat.format("dd/MM/yyyy HH:mm", f.lastModified())
                          : "a que veio com o app";
                      File meus = new File(getFilesDir(), "radares_usuario.csv");
                      int nMeus = meus.exists() ? contarFontes("cabecalho\n" + ler(new FileInputStream(meus))).values().stream().mapToInt(Integer::intValue).sum() : 0;
                      radaresInfo.setText("Base de radares (" + quando + "):\n" + resumo(contarFontes(txt))
                          + "\nMarcados por você: " + nMeus);
                  } catch (Exception e) {
                      radaresInfo.setText("Base de radares indisponível.");
                  }
              }

              // Baixa a lista de radares mais recente do repositório (atualizada toda semana
              // pelo GitHub a partir de ANTT, Transalvador e SEINFRA-BA)
              void atualizarRadares() {
                  radaresInfo.setText("Baixando radares...");
                  new Thread(() -> {
                      String msg;
                      try {
                          HttpURLConnection c = (HttpURLConnection) new URL(URL_RADARES).openConnection();
                          c.setConnectTimeout(15000);
                          c.setReadTimeout(30000);
                          if (c.getResponseCode() != 200) throw new Exception("HTTP " + c.getResponseCode());
                          String txt = ler(c.getInputStream());
                          Map<String, Integer> n = contarFontes(txt);
                          int total = 0;
                          for (int v : n.values()) total += v;
                          if (!txt.startsWith("lat,lon") || total < 100) throw new Exception("arquivo inválido");
                          File tmp = new File(getFilesDir(), "radares.tmp");
                          try (FileOutputStream o = new FileOutputStream(tmp)) { o.write(txt.getBytes("UTF-8")); }
                          if (!tmp.renameTo(new File(getFilesDir(), "radares.csv"))) throw new Exception("falha ao gravar");
                          SpeedService.recarregarRadares = true;
                          msg = "Radares atualizados:\n" + resumo(n);
                      } catch (Exception e) {
                          msg = "Não foi possível atualizar (" + e.getMessage() + "). A base anterior continua valendo.";
                      }
                      final String m = msg;
                      h.post(() -> radaresInfo.setText(m));
                  }).start();
              }

              // Botão +: marca um radar na posição atual, com a velocidade escolhida numa tela grande
              static final int[] VELOCIDADES_RADAR = {40, 60, 80, 100, 110};
              static final String EXTRA_MARCAR = "marcar_radar";
              boolean voltarAoTerminar = false; // aberto pela notificação: volta ao app anterior (Maps) no fim

              void tratarIntent(Intent i) {
                  if (i == null || !i.getBooleanExtra(EXTRA_MARCAR, false)) return;
                  i.removeExtra(EXTRA_MARCAR);
                  voltarAoTerminar = true;
                  adicionarRadar();
              }

              @Override
              protected void onNewIntent(Intent i) {
                  super.onNewIntent(i);
                  setIntent(i);
                  tratarIntent(i);
              }

              void adicionarRadar() {
                  if (!SpeedService.rodando || Double.isNaN(SpeedService.ultLat)) {
                      st.setText("Para marcar um radar, toque em Iniciar e aguarde o sinal de GPS.");
                      voltarAoTerminar = false;
                      return;
                  }
                  final double lat = SpeedService.ultLat, lon = SpeedService.ultLon; // posição no momento do toque

                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(20), dp(28), dp(20), dp(12));
                  box.setBackgroundColor(BG);
                  TextView tit = texto("Novo radar aqui", 26, FG, true);
                  tit.setGravity(Gravity.CENTER);
                  box.addView(tit);
                  TextView pos = texto(String.format(java.util.Locale.US, "%.5f, %.5f", lat, lon), 13, MUT, false);
                  pos.setGravity(Gravity.CENTER);
                  box.addView(pos, margemTopo(4));
                  TextView perg = texto("Qual a velocidade do radar?", 17, FG, false);
                  perg.setGravity(Gravity.CENTER);
                  box.addView(perg, margemTopo(20));

                  final AlertDialog[] d = new AlertDialog[1];
                  // Placas de velocidade grandes, 3 por linha
                  LinearLayout linha = null;
                  for (int i = 0; i < VELOCIDADES_RADAR.length; i++) {
                      if (i % 3 == 0) {
                          linha = new LinearLayout(this);
                          linha.setGravity(Gravity.CENTER);
