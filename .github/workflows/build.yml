name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Criar projeto
        run: |
          mkdir -p app/src/main/java/com/alerta/velocidade

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AlertaVelocidade"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.alerta.velocidade'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.alerta.velocidade'
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName '2.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:label="Alerta de Velocidade"
                  android:icon="@android:drawable/ic_menu_mylocation"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".SpeedService"
                      android:exported="false"
                      android:foregroundServiceType="location"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/alerta/velocidade/MainActivity.java <<'EOF'
          package com.alerta.velocidade;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.InputType;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import java.util.ArrayList;

          public class MainActivity extends Activity {
              static final int[] PADRAO = {60, 80, 100};
              EditText[] lim = new EditText[3];
              TextView vel, placa, via, st;
              CheckBox usarVia;
              Button btn;
              Handler h = new Handler(Looper.getMainLooper());
              Runnable tick = new Runnable() {
                  public void run() { atualizar(); h.postDelayed(this, 500); }
              };

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  SharedPreferences p = getSharedPreferences("cfg", 0);
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setPadding(48, 96, 48, 48);
                  l.setBackgroundColor(Color.parseColor("#101418"));

                  LinearLayout topo = new LinearLayout(this);
                  topo.setGravity(Gravity.CENTER);

                  vel = new TextView(this);
                  vel.setTextSize(88);
                  vel.setTextColor(Color.WHITE);
                  vel.setText("--");
                  topo.addView(vel);

                  // Placa de limite no estilo brasileiro (círculo vermelho)
                  placa = new TextView(this);
                  placa.setTextSize(30);
                  placa.setTextColor(Color.BLACK);
                  placa.setGravity(Gravity.CENTER);
                  GradientDrawable g = new GradientDrawable();
                  g.setShape(GradientDrawable.OVAL);
                  g.setColor(Color.WHITE);
                  g.setStroke(22, Color.parseColor("#D32F2F"));
                  placa.setBackground(g);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(260, 260);
                  lp.leftMargin = 48;
                  placa.setLayoutParams(lp);
                  placa.setText("?");
                  topo.addView(placa);
                  l.addView(topo);

                  TextView u = new TextView(this);
                  u.setText("km/h");
                  u.setTextColor(Color.GRAY);
                  u.setGravity(Gravity.CENTER);
                  l.addView(u);

                  via = new TextView(this);
                  via.setTextColor(Color.LTGRAY);
                  via.setGravity(Gravity.CENTER);
                  via.setPadding(0, 16, 0, 40);
                  l.addView(via);

                  usarVia = new CheckBox(this);
                  usarVia.setText("Usar limite da via (OpenStreetMap)");
                  usarVia.setTextColor(Color.WHITE);
                  usarVia.setChecked(p.getBoolean("via", true));
                  l.addView(usarVia);

                  TextView expl = new TextView(this);
                  expl.setText("Limites fixos (usados quando a via não tem limite cadastrado):");
                  expl.setTextColor(Color.GRAY);
                  expl.setPadding(0, 24, 0, 0);
                  l.addView(expl);

                  for (int i = 0; i < 3; i++) {
                      TextView t = new TextView(this);
                      t.setText("Limite " + (i + 1) + " (km/h)");
                      t.setTextColor(Color.GRAY);
                      t.setPadding(0, 16, 0, 0);
                      l.addView(t);
                      lim[i] = new EditText(this);
                      lim[i].setInputType(InputType.TYPE_CLASS_NUMBER);
                      lim[i].setTextColor(Color.WHITE);
                      lim[i].setTextSize(26);
                      lim[i].setText(String.valueOf(p.getInt("l" + i, PADRAO[i])));
                      l.addView(lim[i]);
                  }

                  btn = new Button(this);
                  btn.setTextSize(22);
                  btn.setOnClickListener(v -> {
                      if (SpeedService.rodando) {
                          stopService(new Intent(this, SpeedService.class));
                      } else {
                          salvar();
                          pedirPermissoes();
                      }
                  });
                  l.addView(btn);

                  st = new TextView(this);
                  st.setTextColor(Color.GRAY);
                  st.setPadding(0, 32, 0, 0);
                  st.setText("Depois de iniciar, pode abrir o Maps. O alerta continua em segundo plano.\nPara mudar os limites, toque em Parar, ajuste e inicie de novo.");
                  l.addView(st);

                  ScrollView s = new ScrollView(this);
                  s.addView(l);
                  setContentView(s);
              }

              void salvar() {
                  SharedPreferences.Editor e = getSharedPreferences("cfg", 0).edit();
                  for (int i = 0; i < 3; i++) {
                      int v;
                      try { v = Integer.parseInt(lim[i].getText().toString()); }
                      catch (Exception ex) { v = PADRAO[i]; }
                      e.putInt("l" + i, v);
                  }
                  e.putBoolean("via", usarVia.isChecked());
                  e.apply();
              }

              void pedirPermissoes() {
                  ArrayList<String> faltam = new ArrayList<>();
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      faltam.add(Manifest.permission.ACCESS_FINE_LOCATION);
                      faltam.add(Manifest.permission.ACCESS_COARSE_LOCATION);
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      faltam.add(Manifest.permission.POST_NOTIFICATIONS);
                  }
                  if (faltam.isEmpty()) iniciar();
                  else requestPermissions(faltam.toArray(new String[0]), 1);
              }

              @Override
              public void onRequestPermissionsResult(int c, String[] perms, int[] res) {
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                      iniciar();
                  } else {
                      st.setText("Sem permissão de localização o app não consegue medir a velocidade.");
                  }
              }

              void iniciar() {
                  startForegroundService(new Intent(this, SpeedService.class));
              }

              void atualizar() {
                  boolean r = SpeedService.rodando;
                  float k = SpeedService.kmh;
                  vel.setText(!r || k < 0 ? "--" : String.valueOf(Math.round(k)));
                  int lv = SpeedService.limVia;
                  placa.setText(r && lv > 0 ? String.valueOf(lv) : "?");
                  if (!r) via.setText("");
                  else if (lv > 0) via.setText(SpeedService.nomeVia);
                  else via.setText(SpeedService.statusVia);
                  btn.setText(r ? "Parar" : "Iniciar");
                  usarVia.setEnabled(!r);
                  for (EditText e : lim) e.setEnabled(!r);
              }

              @Override protected void onResume() { super.onResume(); h.post(tick); }
              @Override protected void onPause() { super.onPause(); h.removeCallbacks(tick); }
          }
          EOF

          cat > app/src/main/java/com/alerta/velocidade/SpeedService.java <<'EOF'
          package com.alerta.velocidade;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.media.AudioManager;
          import android.media.ToneGenerator;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.util.Locale;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class SpeedService extends Service implements LocationListener {
              static volatile boolean rodando = false;
              static volatile float kmh = -1;
              static volatile int limVia = -1;          // limite da via atual (-1 = desconhecido)
              static volatile String nomeVia = "";
              static volatile String statusVia = "";

              static final int MARGEM = 3;               // km/h abaixo do limite para rearmar
              static final long INTERVALO_MS = 10000;    // consulta a cada 10 s...
              static final float DISTANCIA_M = 150;      // ...ou a cada 150 m
              static final long VALIDADE_MS = 60000;     // descarta limite antigo após 60 s sem atualizar
              static final String[] SERVIDORES = {
                  "https://overpass-api.de/api/interpreter",
                  "https://overpass.kumi.systems/api/interpreter"
              };
              static final String TIPOS =
                  "^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|service|road|" +
                  "motorway_link|trunk_link|primary_link|secondary_link|tertiary_link)$";

              boolean usarVia;
              boolean[] acima = new boolean[3];
              boolean acimaVia = false;
              int[] lims = new int[3];
              ToneGenerator tg;
              LocationManager lm;
              NotificationManager nm;
              Handler h = new Handler(Looper.getMainLooper());
              ExecutorService rede = Executors.newSingleThreadExecutor();
              volatile boolean consultando = false;
              long ultimaConsulta = 0, ultimoSucesso = 0;
              Location locUltimaConsulta;
              int servidor = 0;

              @Override
              public int onStartCommand(Intent intent, int flags, int id) {
                  SharedPreferences p = getSharedPreferences("cfg", 0);
                  for (int i = 0; i < 3; i++) lims[i] = p.getInt("l" + i, MainActivity.PADRAO[i]);
                  usarVia = p.getBoolean("via", true);

                  nm = getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(new NotificationChannel("vel", "Velocidade", NotificationManager.IMPORTANCE_LOW));
                  Notification n = notif("Aguardando GPS...");
                  if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION);
                  else startForeground(1, n);

                  if (tg == null) tg = new ToneGenerator(AudioManager.STREAM_MUSIC, 100);
                  if (lm == null) {
                      lm = getSystemService(LocationManager.class);
                      try { lm.requestLocationUpdates(LocationManager.GPS_PROVIDER, 500, 0, this, Looper.getMainLooper()); }
                      catch (SecurityException e) { stopSelf(); }
                  }
                  statusVia = usarVia ? "Buscando limite da via..." : "Limite da via desligado";
                  rodando = true;
                  return START_STICKY;
              }

              Notification notif(String txt) {
                  PendingIntent pi = PendingIntent.getActivity(this, 0,
                      new Intent(this, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                  return new Notification.Builder(this, "vel")
                      .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                      .setContentTitle("Alerta de Velocidade")
                      .setContentText(txt)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setContentIntent(pi)
                      .build();
              }

              void bip(int n, int tom) {
                  for (int k = 0; k <= n; k++) {
                      h.postDelayed(() -> { if (tg != null) tg.startTone(tom, 200); }, k * 300L);
                  }
              }

              @Override
              public void onLocationChanged(Location loc) {
                  if (usarVia) talvezConsultar(loc);
                  if (!loc.hasSpeed()) return;
                  float v = loc.getSpeed() * 3.6f;
                  kmh = v;

                  // Limite da via vencido (sem atualização recente)? Volta aos limites fixos.
                  if (limVia > 0 && System.currentTimeMillis() - ultimoSucesso > VALIDADE_MS) {
                      limVia = -1;
                      statusVia = "Limite da via indisponível, usando limites fixos";
                  }

                  String txt;
                  if (limVia > 0) {
                      // Usa o limite da via
                      if (!acimaVia && v >= limVia) { acimaVia = true; bip(3, ToneGenerator.TONE_PROP_BEEP2); }
                      else if (acimaVia && v < limVia - MARGEM) { acimaVia = false; }
                      for (int i = 0; i < 3; i++) acima[i] = v >= lims[i]; // evita apito ao voltar aos fixos
                      txt = Math.round(v) + " km/h  ·  limite da via " + limVia;
                  } else {
                      // Usa os 3 limites fixos
                      for (int i = 0; i < 3; i++) {
                          if (!acima[i] && v >= lims[i]) { acima[i] = true; bip(i + 1, ToneGenerator.TONE_PROP_BEEP); }
                          else if (acima[i] && v < lims[i] - MARGEM) { acima[i] = false; }
                      }
                      txt = Math.round(v) + " km/h  ·  limites " + lims[0] + " / " + lims[1] + " / " + lims[2];
                  }
                  nm.notify(1, notif(txt));
              }

              void talvezConsultar(Location loc) {
                  long agora = System.currentTimeMillis();
                  if (consultando) return;
                  boolean tempo = agora - ultimaConsulta >= INTERVALO_MS;
                  boolean dist = locUltimaConsulta == null || loc.distanceTo(locUltimaConsulta) >= DISTANCIA_M;
                  if (!tempo && !dist) return;
                  if (agora - ultimaConsulta < 3000) return; // nunca mais de 1 consulta a cada 3 s
                  consultando = true;
                  ultimaConsulta = agora;
                  locUltimaConsulta = new Location(loc);
                  final double lat = loc.getLatitude(), lon = loc.getLongitude();
                  rede.execute(() -> {
                      Object[] r = null;
                      for (int t = 0; t < SERVIDORES.length && r == null; t++) {
                          try { r = consultar(SERVIDORES[servidor], lat, lon); }
                          catch (Exception e) { servidor = (servidor + 1) % SERVIDORES.length; }
                      }
                      final Object[] res = r;
                      h.post(() -> {
                          consultando = false;
                          if (res == null) { statusVia = "Sem conexão com o OpenStreetMap"; return; }
                          ultimoSucesso = System.currentTimeMillis();
                          int novo = (Integer) res[0];
                          if (novo != limVia) acimaVia = false; // limite mudou: rearma o alerta
                          limVia = novo;
                          nomeVia = (String) res[1];
                          statusVia = novo > 0 ? "" : ((String) res[1]).isEmpty()
                              ? "Nenhuma via encontrada, usando limites fixos"
                              : res[1] + ": sem limite cadastrado, usando limites fixos";
                      });
                  });
              }

              // Retorna {limite, nome da via}. Limite -1 se a via mais próxima não tiver maxspeed.
              Object[] consultar(String url, double lat, double lon) throws Exception {
                  String q = String.format(Locale.US,
                      "[out:json][timeout:8];way(around:30,%.6f,%.6f)[highway~\"%s\"];out tags geom;",
                      lat, lon, TIPOS);
                  HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                  c.setConnectTimeout(6000);
                  c.setReadTimeout(9000);
                  c.setDoOutput(true);
                  c.setRequestProperty("User-Agent", "AlertaVelocidade/2.0 (app pessoal)");
                  c.setRequestProperty("Content-Type", "application/x-www-form-urlencoded");
                  try (OutputStream o = c.getOutputStream()) {
                      o.write(("data=" + URLEncoder.encode(q, "UTF-8")).getBytes("UTF-8"));
                  }
                  if (c.getResponseCode() != 200) throw new Exception("HTTP " + c.getResponseCode());
                  ByteArrayOutputStream buf = new ByteArrayOutputStream();
                  try (InputStream in = c.getInputStream()) {
                      byte[] b = new byte[8192]; int n;
                      while ((n = in.read(b)) > 0) buf.write(b, 0, n);
                  }
                  JSONArray els = new JSONObject(buf.toString("UTF-8")).getJSONArray("elements");

                  JSONObject melhor = null;
                  double menor = Double.MAX_VALUE;
                  for (int i = 0; i < els.length(); i++) {
                      JSONObject w = els.getJSONObject(i);
                      JSONArray g = w.optJSONArray("geometry");
                      if (g == null || g.length() == 0) continue;
                      double d = distanciaVia(lat, lon, g);
                      if (d < menor) { menor = d; melhor = w; }
                  }
                  if (melhor == null) return new Object[]{-1, ""};
                  JSONObject tags = melhor.optJSONObject("tags");
                  if (tags == null) return new Object[]{-1, ""};
                  String nome = tags.optString("name", tags.optString("ref", "Via sem nome"));
                  String ref = tags.optString("ref", "");
                  if (!ref.isEmpty() && !nome.contains(ref)) nome = nome + " (" + ref + ")";
                  return new Object[]{lerLimite(tags.optString("maxspeed", "")), nome};
              }

              static int lerLimite(String s) {
                  Matcher m = Pattern.compile("(\\d+)").matcher(s);
                  if (!m.find()) return -1;
                  int v = Integer.parseInt(m.group(1));
                  if (s.contains("mph")) v = Math.round(v * 1.609f);
                  return v >= 5 && v <= 150 ? v : -1;
              }

              // Distância em metros do ponto até a linha da via (aproximação plana, ok para curtas distâncias)
              static double distanciaVia(double lat, double lon, JSONArray g) {
                  double kx = 111320 * Math.cos(Math.toRadians(lat)), ky = 110540;
                  double menor = Double.MAX_VALUE;
                  double px = 0, py = 0;
                  for (int i = 0; i < g.length(); i++) {
                      JSONObject p = g.optJSONObject(i);
                      if (p == null) continue;
                      double x = (p.optDouble("lon") - lon) * kx, y = (p.optDouble("lat") - lat) * ky;
                      if (i > 0) menor = Math.min(menor, distSegmento(px, py, x, y));
                      else menor = Math.hypot(x, y);
                      px = x; py = y;
                  }
                  return menor;
              }

              static double distSegmento(double ax, double ay, double bx, double by) {
                  double dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
                  double t = l2 == 0 ? 0 : Math.max(0, Math.min(1, -(ax * dx + ay * dy) / l2));
                  return Math.hypot(ax + t * dx, ay + t * dy);
              }

              @Override public void onStatusChanged(String p, int s, Bundle b) {}
              @Override public void onProviderEnabled(String p) {}
              @Override public void onProviderDisabled(String p) {}

              @Override
              public void onDestroy() {
                  rodando = false;
                  kmh = -1;
                  limVia = -1;
                  nomeVia = "";
                  if (lm != null) lm.removeUpdates(this);
                  h.removeCallbacksAndMessages(null);
                  rede.shutdownNow();
                  if (tg != null) { tg.release(); tg = null; }
                  super.onDestroy();
              }

              @Override public IBinder onBind(Intent i) { return null; }
          }
          EOF

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Alerta de Velocidade v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
