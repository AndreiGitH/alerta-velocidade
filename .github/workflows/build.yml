              // Velocímetro estilo painel: aro metálico, escala, faixas verde/laranja/vermelha,
              // ponteiro com brilho, velocidade no centro e relógio embaixo.
              static class Gauge extends View {
                  static final int VERDE = 0xFF2ED47A, LARANJA = 0xFFFF8A1F, VERMELHO = 0xFFFF3B3B;
                  final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  final RectF r = new RectF();
                  final Matrix giro = new Matrix();
                  final float d;
                  float alvo = -1, atual = 0, cx, cy;
                  int a = 60, b = 80, max = 140;

                  Gauge(Context c) {
                      super(c);
                      d = c.getResources().getDisplayMetrics().density;
                  }

                  // v < 0 = sem leitura. Abaixo de a: verde; de a até b: laranja; a partir de b: vermelho.
                  void mostrar(float v, int a, int b) {
                      this.a = a;
                      this.b = Math.max(a, b);
                      max = Math.max(140, (this.b + 59) / 20 * 20);
                      alvo = v;
                      invalidate();
                  }

                  int cor(float v) { return v >= b ? VERMELHO : v >= a ? LARANJA : VERDE; }

                  float ang(float v) { return 135 + 270 * Math.max(0, Math.min(v, max)) / max; }

                  void arco(Canvas c, float raio, float de, float ate) {
                      r.set(cx - raio, cy - raio, cx + raio, cy + raio);
                      c.drawArc(r, de, ate - de, false, p);
                  }

                  void raio(Canvas c, float v, float r1, float r2) {
                      double t = Math.toRadians(ang(v));
                      float cs = (float) Math.cos(t), sn = (float) Math.sin(t);
                      c.drawLine(cx + cs * r1, cy + sn * r1, cx + cs * r2, cy + sn * r2, p);
                  }

                  @Override
                  protected void onMeasure(int ws, int hs) {
                      int w = MeasureSpec.getSize(ws);
                      setMeasuredDimension(w, Math.round(Math.min(w, 360 * d)));
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      // Ponteiro desliza até a velocidade nova em vez de pular
                      float destino = alvo < 0 ? 0 : alvo;
                      atual += (destino - atual) * 0.2f;
                      if (Math.abs(destino - atual) > 0.2f) postInvalidateOnAnimation();
                      else atual = destino;

                      float lado = Math.min(getWidth(), 360 * d);
                      float R = lado / 2 - 6 * d;
                      cx = getWidth() / 2f;
                      cy = R + 6 * d;
                      float rf = R * 0.92f, ri = R * 0.62f;

                      // Aro metálico
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeCap(Paint.Cap.ROUND);
                      p.setStrokeWidth(5 * d);
                      p.setShader(new SweepGradient(cx, cy,
                          new int[]{0xFF4A5058, 0xFFF0F3F5, 0xFF4A5058, 0xFFC8CDD2, 0xFF4A5058}, null));
                      arco(c, R * 0.98f, 128, 412);
                      p.setShader(null);

                      // Faixas coloridas que esmaecem em direção ao centro
                      float[] z = {0, a, b, max};
                      int[] cores = {VERDE, LARANJA, VERMELHO};
                      p.setStrokeCap(Paint.Cap.BUTT);
                      for (int i = 0; i < 3; i++) {
                          if (z[i + 1] <= z[i]) continue;
                          int base = cores[i] & 0x00FFFFFF;
                          p.setStrokeWidth(rf - ri);
                          p.setShader(new RadialGradient(cx, cy, rf,
                              new int[]{base, base, base | 0xC0000000}, new float[]{0, ri / rf, 1}, Shader.TileMode.CLAMP));
                          arco(c, (rf + ri) / 2, ang(z[i]), ang(z[i + 1]));
                          p.setShader(null);
                          p.setStrokeWidth(3 * d);
                          p.setColor(cores[i]);
                          arco(c, rf, ang(z[i]), ang(z[i + 1]));
                      }

                      // Escala: traço grande a cada 20, pequeno a cada 5
                      for (int v = 0; v <= max; v += 5) {
                          boolean grande = v % 20 == 0;
                          p.setStrokeWidth((grande ? 3 : 1.5f) * d);
                          p.setColor(grande ? 0xFFFFFFFF : 0x99FFFFFF);
                          raio(c, v, rf - (grande ? 14 : 7) * d, rf);
                      }
                      p.setStyle(Paint.Style.FILL);
                      p.setTextAlign(Paint.Align.CENTER);
                      p.setTypeface(Typeface.create(Typeface.SANS_SERIF, Typeface.BOLD_ITALIC));
                      p.setTextSize(R * 0.1f);
                      p.setColor(0xFFE6E9EC);
                      for (int v = 0; v <= max; v += 20) {
                          double t = Math.toRadians(ang(v));
                          float rr = R * 0.73f;
                          c.drawText(String.valueOf(v), cx + (float) Math.cos(t) * rr,
                              cy + (float) Math.sin(t) * rr + R * 0.035f, p);
                      }

                      // Ponteiro
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeCap(Paint.Cap.ROUND);
                      p.setStrokeWidth(5 * d);
                      p.setColor(0xFFFFC233);
                      p.setShadowLayer(8 * d, 0, 0, 0xFFFF6A00);
                      raio(c, atual, ri - 4 * d, R * 0.95f);
                      p.clearShadowLayer();

                      // Disco central escuro com anel verde → laranja → vermelho
                      float rd = R * 0.56f;
                      p.setStyle(Paint.Style.FILL);
                      p.setShader(new RadialGradient(cx, cy - rd * 0.3f, rd * 1.2f, 0xFF16263D, 0xFF04060A, Shader.TileMode.CLAMP));
                      c.drawCircle(cx, cy, rd, p);
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(3 * d);
                      SweepGradient anel = new SweepGradient(cx, cy,
                          new int[]{VERDE, LARANJA, VERMELHO, VERMELHO}, new float[]{0, 0.4f, 0.75f, 1});
                      giro.setRotate(135, cx, cy);
                      anel.setLocalMatrix(giro);
                      p.setShader(anel);
                      arco(c, rd, 135, 405);
                      p.setShader(null);

                      // Velocidade, unidade e relógio
                      p.setStyle(Paint.Style.FILL);
                      p.setTypeface(Typeface.create("sans-serif", Typeface.BOLD));
                      p.setTextSize(R * 0.48f);
                      p.setColor(alvo < 0 || cor(alvo) == VERDE ? 0xFFFFFFFF : cor(alvo));
                      c.drawText(alvo < 0 ? "--" : String.valueOf(Math.round(alvo)), cx, cy + R * 0.16f, p);
                      p.setTypeface(Typeface.create("sans-serif-medium", Typeface.NORMAL));
                      p.setTextSize(R * 0.085f);
                      p.setColor(0xFF9AA4B2);
                      c.drawText("KM/H", cx, cy + R * 0.36f, p);
                      p.setTypeface(Typeface.create("sans-serif-light", Typeface.NORMAL));
                      p.setTextSize(R * 0.22f);
                      p.setColor(0xFFFFFFFF);
                      c.drawText(DateFormat.format("HH:mm", System.currentTimeMillis()).toString(), cx, cy + R * 0.93f, p);
                  }
              }
          }
