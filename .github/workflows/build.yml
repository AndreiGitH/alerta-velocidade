              // Radares marcados pelo usuário ficam em files/radares_usuario.csv (mesmo formato da base,
              // sem cabeçalho) e não são apagados quando a base é atualizada.
              void salvarRadarUsuario(double lat, double lon, int limite) {
                  String linha = String.format(java.util.Locale.US, "%.6f,%.6f,%d,Marcado por mim,,%s,Usuário\n",
                      lat, lon, limite, DateFormat.format("dd/MM/yyyy", System.currentTimeMillis()));
                  try (FileOutputStream o = new FileOutputStream(new File(getFilesDir(), "radares_usuario.csv"), true)) {
                      o.write(linha.getBytes("UTF-8"));
                      SpeedService.recarregarRadares = true;
                      st.setText("Radar de " + limite + " km/h adicionado nesta posição.");
                  } catch (Exception e) {
                      st.setText("Não foi possível salvar o radar (" + e.getMessage() + ").");
                  }
              }

              File arquivoMeus() { return new File(getFilesDir(), "radares_usuario.csv"); }

              ArrayList<String> lerMeus() {
                  ArrayList<String> l = new ArrayList<>();
                  try {
                      for (String x : ler(new FileInputStream(arquivoMeus())).split("\n"))
                          if (x.split(",").length >= 3) l.add(x.trim());
                  } catch (Exception e) { /* sem arquivo = lista vazia */ }
                  return l;
              }

              void gravarMeus(ArrayList<String> l) {
                  StringBuilder sb = new StringBuilder();
                  for (String x : l) sb.append(x).append("\n");
                  try (FileOutputStream o = new FileOutputStream(arquivoMeus())) { o.write(sb.toString().getBytes("UTF-8")); }
                  catch (Exception e) { /* ignora */ }
                  SpeedService.recarregarRadares = true;
              }

