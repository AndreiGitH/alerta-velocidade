name: Sonda DF
on: push
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p sonda
          Q='[out:json][timeout:180];area["ISO3166-2"="BR-DF"]->.df;node(area.df)[highway=speed_camera];out meta;'
          for u in https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter; do
            curl -sS -m 200 -A 'AlertaVelocidade/1.0 (github.com/AndreiGitH/alerta-velocidade)' --data-urlencode "data=$Q" "$u" -o sonda/osm_df.json && head -c 1 sonda/osm_df.json | grep -q '{' && break; sleep 30
          done
          git config user.name bot; git config user.email bot@x
          git add sonda; git commit -m "resultado sonda osm3"; git push
